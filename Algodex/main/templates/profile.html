{% extends 'layout.html' %}

{% block title %} Algodex | {{ user.username }} {% endblock %}

{% block body %}
    <h1>{{ user.username }}</h1>

    <div>
        <h2>{{ user.username }}'s Solves</h2>
        {% for solve in solves %}
            <h3>{{ solve.time|floatformat:2 }}</h3>
            <p>{{ solve.algorithm }}</p>
            <p>{{ solve.timestamp }}</p>
        {% endfor %}
    </div>

{% endblock %}
